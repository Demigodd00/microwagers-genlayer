name: Verify MicroWagers

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_MICROWAGERS_ADDRESS: "0x07D4eD4B2293faE326BaF9a943Ed3a56E04D8D4a"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install contract test toolchain
        run: pip install -r requirements-dev.txt
      - name: Prepare pinned GenVM runner
        run: python scripts/prepare_gltest_runner.py
      - name: Run exact-release gate
        # Production can still be building this commit. Verify it separately
        # after deployment; CI validates code and immutable evidence offline.
        run: python scripts/check_micro_wagers_release.py --skip-web --skip-hosting

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/microwagers-web
    env:
      NEXT_PUBLIC_MICROWAGERS_ADDRESS: "0x07D4eD4B2293faE326BaF9a943Ed3a56E04D8D4a"
      NEXT_PUBLIC_NETWORK_NAME: StudioNet
      NEXT_PUBLIC_SITE_URL: https://microwagers.vercel.app
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/microwagers-web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm audit --prod --audit-level=high
